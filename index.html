    <script>
        function updateFloatingPositions() {
            const floaters = document.querySelectorAll('.floating');

            floaters.forEach(floater => {
                const anchorId = floater.dataset.anchor;
                const anchorEl = document.getElementById(anchorId);
                if (!anchorEl) return;

                const rect = anchorEl.getBoundingClientRect();
                const scrollY = window.scrollY;

                // Get anchor's center relative to the document
                const anchorX = rect.left + rect.width / 2 + window.scrollX;
                const anchorY = rect.top + rect.height / 2 + scrollY;

                // Read optional data- attributes
                const offsetX = parseFloat(floater.dataset.x || 0);
                const offsetY = parseFloat(floater.dataset.y || 0);
                const speed = parseFloat(floater.dataset.speed || 1);

                // Apply parallax effect
                const adjustedY = anchorY - (scrollY * (speed - 1)) + offsetY;

                floater.style.transform = `translate(${anchorX + offsetX}px, ${adjustedY}px)`;
            });
        }

        // Attach listeners
        window.addEventListener('scroll', updateFloatingPositions);
        window.addEventListener('resize', updateFloatingPositions);
        window.addEventListener('load', updateFloatingPositions);
    </script>
